 {id:'en-ta',l:'Technical Assistance',color:'#854F0B',

  sub_:[
   n('ADB CDIA','Cities Development Initiative for Asia. TA and investment preparation for Asian cities.','https://cdia.asia',[{t:'Portfolio facilitated',v:'$3.2B+',y:2023}],'ADB, bilateral donors','Direct partnership for MMC Asia-Pacific member cities seeking project-prep support.',{url:'https://www.adb.org/annual-report/editions/2024',label:'ADB Annual Report 2024 (adb.org)'}),

   n('City Climate Finance Gap Fund','TA for city climate action. World Bank window ties TA to committed WB lending; EIB window prepares projects and seeks onward financing from third parties. ICLEI, C40, and GCoM are operational partners. Over 390 cities approved.','https://www.citygapfund.org',[{t:'Donor commitments',v:'EUR 100M+',y:2024},{t:'Cities approved',v:'390+',y:2026}],'Germany (BMUKN/BMZ), Luxembourg; implemented by World Bank and EIB','Direct engagement target — explore whether MMC member cities qualify for Gap Fund TA.',null,['Climate migration','Housing'],{url:'https://www.citygapfund.org/what-we-offer/',label:'City Climate Finance Gap Fund 2024'}),

// MuniFi Capital Flow Map — App Logic v3.0

function init(){
  document.getElementById('app').innerHTML=
    '<div class="bar"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+
    '<span class="tag source">Source</span><span class="tag enabler">Enabler</span>'+
    '<span class="tag intermediary">Intermediary</span><span class="tag destination">Destination</span>'+
    '<span style="font-size:10px;color:#aaa;margin-left:4px">· click any node to trace flows · click again to clear</span>'+
    '</div><button class="rbtn" id="rbtn">Reset</button></div>'+
    '<div class="srw"><input type="text" id="srch" placeholder="Search any actor, category, or frontier theme (e.g. IDB, GCF, Health, Gender equality)...">'+
    '<div class="srd" id="srd"></div></div>'+
    '<div class="legend-note">Lines are colored by originating Source category. Dashed lines &#8674; show funds routing <em>through</em> National Governments before reaching cities. Dashed lines within the Source tier show MDB capitalization of National Development Banks.</div>'+
    '<div class="flowwrap" id="flowwrap"><canvas id="cv"></canvas>'+
    '<div class="zone" id="z-source"><div class="zoneh source">Source</div><div class="grprow" id="g-source"></div></div>'+
    '<div class="zone" id="z-enabler"><div class="zoneh enabler">Enabler</div><div class="grprow" id="g-enabler"></div></div>'+
    '<div class="zone" id="z-intermediary"><div class="zoneh intermediary">Intermediary</div><div class="grprow" id="g-intermediary"></div></div>'+
    '<div class="zone" id="z-destination"><div class="zoneh destination">Destination</div><div class="grprow" id="g-destination"></div></div>'+
    '</div>'+
    '<div class="inf" id="inf">Click any category or named actor, or search above, to trace its place in the capital flow.</div>'+
    '<div class="footer">Vantage Collaborative LLC for Mayors Migration Council &middot; Prototype v3.0</div>';

  var act=null,atype=null,curNode=null;

  function findNode(id,type){
    if(type==='s')return S.find(function(x){return x.id===id;});
    if(type==='en')return EN.find(function(x){return x.id===id;});
    if(type==='int')return I.find(function(x){return x.id===id;});
    if(type==='d')return D.find(function(x){return x.id===id;});
  }

  function gc(id,tp){
    if(tp==='s'){
      var node=findNode(id,'s');
      var intIds=node.i.filter(function(x){return x.indexOf('int-')===0;});
      var expanded=intIds.slice();
      intIds.forEach(function(iid){var iNode=findNode(iid,'int');if(iNode&&iNode.i2i){iNode.i2i.forEach(function(t){if(expanded.indexOf(t)<0)expanded.push(t);});}});
      // Build destination set: source's own d array PLUS destinations of connected intermediaries
      var dIds=node.d.slice();
      expanded.forEach(function(iid){var iNode=findNode(iid,'int');if(iNode){iNode.d.forEach(function(did){if(dIds.indexOf(did)<0)dIds.push(did);});}});
      // Include srcLinks (e.g. MDBs → NDBs capitalization)
      var srcLinkIds=node.srcLinks||[];
      return{s:[id],en:node.i.filter(function(x){return x.indexOf('en-')===0;}),int:expanded,d:dIds,srcLinks:srcLinkIds,color:node.color};
    }
    if(tp==='en'){
      var node=findNode(id,'en');
      var sIds=S.filter(function(s){return s.i.indexOf(id)>=0;}).map(function(s){return s.id;});
      var intIds=[];
      if(node.intLinks){node.intLinks.forEach(function(iid){if(intIds.indexOf(iid)<0)intIds.push(iid);});}
      var dIds=node.d.slice();
      intIds.forEach(function(iid){var iNode=findNode(iid,'int');if(iNode){iNode.d.forEach(function(did){if(dIds.indexOf(did)<0)dIds.push(did);});}});
      return{s:sIds,en:[id],int:intIds,d:dIds,color:node.color};
    }
    if(tp==='int'){
      var node=findNode(id,'int');
      // Sources: only those directly connecting to THIS intermediary (not to i2i-linked ones)
      var sIds=S.filter(function(s){return s.i.indexOf(id)>=0;}).map(function(s){return s.id;});
      // Intermediaries: include this node, its i2i targets (dashed arcs), and any that feed into it via i2i
      var intIds=[id];
      if(node.i2i){node.i2i.forEach(function(t){if(intIds.indexOf(t)<0)intIds.push(t);});}
      I.forEach(function(other){if(other.i2i&&other.i2i.indexOf(id)>=0&&intIds.indexOf(other.id)<0)intIds.push(other.id);});
      // Destinations: from this node only, plus i2i targets — but NOT from i2i upstream nodes
      var dIds=node.d.slice();
      if(node.i2i){node.i2i.forEach(function(iid){var iNode=findNode(iid,'int');if(iNode){iNode.d.forEach(function(did){if(dIds.indexOf(did)<0)dIds.push(did);});}});}
      return{s:sIds,en:[],int:intIds,d:dIds,color:node.color};
    }
    if(tp==='d'){
      var sIds=S.filter(function(s){return s.d.indexOf(id)>=0;}).map(function(s){return s.id;});
      var enIds=EN.filter(function(e){return e.d.indexOf(id)>=0;}).map(function(e){return e.id;});
      var intIds=I.filter(function(i){return i.d.indexOf(id)>=0;}).map(function(i){return i.id;});
      I.forEach(function(other){if(other.i2i&&other.i2i.some(function(t){return intIds.indexOf(t)>=0;})&&intIds.indexOf(other.id)<0)intIds.push(other.id);});
      return{s:sIds,en:enIds,int:intIds,d:[id],color:'#854F0B'};
    }
    return{s:[],en:[],int:[],d:[]};
  }

  function mk(tag,cls,id,html,fn,style){
    var el=document.createElement(tag);
    el.className=cls;if(id)el.id=id;el.innerHTML=html;
    if(style)el.setAttribute('style',style);
    if(fn)el.onclick=fn;
    return el;
  }

  function rndr(){
    ['g-source','g-enabler','g-intermediary','g-destination'].forEach(function(id){document.getElementById(id).innerHTML='';});
    S.forEach(function(s){
      var grp=mk('div','grp',null,'');
      var lbl=s.l+(s.placeholder?' <span class="ph-tag">TBD</span>':'');
      var st='background:'+s.color+'18;border-color:'+s.color+';color:'+s.color;
      grp.appendChild(mk('div','nc','n-'+s.id,lbl,function(){sel(s.id,'s',s);},st));
      document.getElementById('g-source').appendChild(grp);
    });
    EN.forEach(function(e){
      var grp=mk('div','grp',null,'');
      var st='background:'+e.color+'18;border-color:'+e.color+';color:'+e.color;
      grp.appendChild(mk('div','nc','n-'+e.id,e.l,function(){sel(e.id,'en',e);},st));
      document.getElementById('g-enabler').appendChild(grp);
    });
    I.forEach(function(i){
      var grp=mk('div','grp',null,'');
      var st='background:'+i.color+'18;border-color:'+i.color+';color:'+i.color;
      grp.appendChild(mk('div','nc','n-'+i.id,i.l,function(){sel(i.id,'int',i);},st));
      document.getElementById('g-intermediary').appendChild(grp);
    });
    D.forEach(function(d){
      var grp=mk('div','grp',null,'');
      var st='background:'+d.color+'18;border-color:'+d.color+';color:'+d.color;
      grp.appendChild(mk('div','nc','n-'+d.id,d.l,function(){sel(d.id,'d',d);},st));
      document.getElementById('g-destination').appendChild(grp);
    });
    szc();
  }

  function szc(){
    var fw=document.getElementById('flowwrap');
    var cv=document.getElementById('cv');
    cv.width=fw.offsetWidth*2;cv.height=fw.offsetHeight*2;
    cv.style.width=fw.offsetWidth+'px';cv.style.height=fw.offsetHeight+'px';
  }

  function ncbox(id){
    var el=document.getElementById('n-'+id);if(!el)return null;
    var fw=document.getElementById('flowwrap');
    var er=el.getBoundingClientRect(),fr=fw.getBoundingClientRect();
    return{left:(er.left-fr.left)*2,right:(er.right-fr.left)*2,
           top:(er.top-fr.top)*2,bottom:(er.bottom-fr.top)*2,
           cx:(er.left+er.width/2-fr.left)*2,cy:(er.top+er.height/2-fr.top)*2};
  }

  function routeCurve(ctx,b1,b2,color,dashed){
    var x1=b1.cx,y1=b1.bottom,x2=b2.cx,y2=b2.top;
    ctx.beginPath();ctx.moveTo(x1,y1);
    ctx.bezierCurveTo(x1,(y1+y2)/2,x2,(y1+y2)/2,x2,y2);
    ctx.strokeStyle=color;ctx.lineWidth=dashed?2.5:3;ctx.globalAlpha=0.62;
    if(dashed)ctx.setLineDash([6,4]);
    ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  }

  function redraw(c){
    szc();
    var cv=document.getElementById('cv');
    var ctx=cv.getContext('2d');
    ctx.clearRect(0,0,cv.width,cv.height);

    // Draw dashed lines from source to srcLink sources (e.g. MDB → NDB capitalization)
    if(c.srcLinks&&c.srcLinks.length){
      var sNode=findNode(c.s[0],'s');
      var b1=ncbox(c.s[0]);
      if(b1&&sNode){
        c.srcLinks.forEach(function(linkedId){
          var b2=ncbox(linkedId);if(!b2)return;
          // Draw horizontal dashed line within Source tier
          ctx.beginPath();ctx.moveTo(b1.cx,b1.cy);ctx.lineTo(b2.cx,b2.cy);
          ctx.strokeStyle=sNode.color;ctx.lineWidth=2;ctx.globalAlpha=0.5;
          ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
          // Arrowhead pointing toward NDB
          var angle=Math.atan2(b2.cy-b1.cy,b2.cx-b1.cx);
          var hs=9;
          ctx.beginPath();
          ctx.moveTo(b2.cx,b2.cy);
          ctx.lineTo(b2.cx-hs*Math.cos(angle-0.4),b2.cy-hs*Math.sin(angle-0.4));
          ctx.lineTo(b2.cx-hs*Math.cos(angle+0.4),b2.cy-hs*Math.sin(angle+0.4));
          ctx.closePath();
          ctx.fillStyle=sNode.color;ctx.globalAlpha=0.6;ctx.fill();ctx.globalAlpha=1;
        });
      }
    }

    c.s.forEach(function(sid){
      var sNode=findNode(sid,'s');
      var b1=ncbox(sid);if(!b1)return;
      var col=sNode.color;
      sNode.i.forEach(function(target){
        var tp=target.indexOf('en-')===0?'en':'int';
        if(tp==='en'&&c.en.indexOf(target)<0)return;
        if(tp==='int'&&c.int.indexOf(target)<0)return;
        // When an intermediary is selected, only draw lines to the clicked facility itself
        // (not to other intermediaries this source also happens to connect to)
        if(tp==='int'&&atype==='int'&&target!==act)return;
        var b2=ncbox(target);if(!b2)return;
        routeCurve(ctx,b1,b2,col,false);
      });
      // Only draw direct Source→Destination lines when no intermediary is selected
      if(atype!=='int'){
        sNode.d.forEach(function(did){
          if(c.d.indexOf(did)<0)return;
          var b2=ncbox(did);if(!b2)return;
          routeCurve(ctx,b1,b2,col,false);
        });
      }
    });

    c.en.forEach(function(eid){
      if(atype==='int')return; // when viewing a facility, enabler lines are not relevant
      var eNode=findNode(eid,'en');
      var b1=ncbox(eid);if(!b1)return;
      eNode.d.forEach(function(did){
        if(c.d.indexOf(did)<0)return;
        var b2=ncbox(did);if(!b2)return;
        routeCurve(ctx,b1,b2,eNode.color,false);
      });
      // Draw dashed line from TA to National Governments (system-level TA)
      if(eNode.intLinks){
        eNode.intLinks.forEach(function(iid){
          var b2=ncbox(iid);if(!b2)return;
          var midY=Math.min(b1.top,b2.top)-22;
          ctx.beginPath();ctx.moveTo(b1.cx,b1.top);
          ctx.bezierCurveTo(b1.cx,midY,b2.cx,midY,b2.cx,b2.top);
          ctx.strokeStyle=eNode.color;ctx.lineWidth=2.5;ctx.globalAlpha=0.55;
          ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
        });
      }
    });

    c.int.forEach(function(iid){
      var iNode=findNode(iid,'int');
      var b1=ncbox(iid);if(!b1)return;
      // When an intermediary is selected, only draw destination lines FROM the clicked node
      // — not from other intermediaries pulled into c.int via i2i chains
      if(atype==='int'&&iid!==act){
        // Still draw i2i dashed arcs that point TO the clicked node
        if(iNode.i2i){
          iNode.i2i.forEach(function(targetId){
            if(targetId!==act)return;
            if(c.int.indexOf(targetId)<0)return;
            var b2=ncbox(targetId);if(!b2)return;
            var midY=Math.min(b1.top,b2.top)-22;
            ctx.beginPath();ctx.moveTo(b1.cx,b1.top);
            ctx.bezierCurveTo(b1.cx,midY,b2.cx,midY,b2.cx,b2.top);
            ctx.strokeStyle=iNode.color;ctx.lineWidth=2.5;ctx.globalAlpha=0.55;
            ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
            var ax=b2.cx,ay=b2.top,hs=10;
            ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax-hs,ay-hs*1.4);ctx.lineTo(ax+hs,ay-hs*1.4);
            ctx.closePath();ctx.fillStyle=iNode.color;ctx.globalAlpha=0.65;ctx.fill();ctx.globalAlpha=1;
          });
        }
        return; // skip destination lines for non-clicked intermediaries
      }
      iNode.d.forEach(function(did){
        if(c.d.indexOf(did)<0)return;
        var b2=ncbox(did);if(!b2)return;
        routeCurve(ctx,b1,b2,iNode.color,false);
      });
      if(iNode.i2i){
        iNode.i2i.forEach(function(targetId){
          if(c.int.indexOf(targetId)<0)return;
          var b2=ncbox(targetId);if(!b2)return;
          var midY=Math.min(b1.top,b2.top)-22;
          // Draw dashed arc
          ctx.beginPath();ctx.moveTo(b1.cx,b1.top);
          ctx.bezierCurveTo(b1.cx,midY,b2.cx,midY,b2.cx,b2.top);
          ctx.strokeStyle=iNode.color;ctx.lineWidth=2.5;ctx.globalAlpha=0.55;
          ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
          // Draw arrowhead at b2.top pointing downward (into target box)
          var ax=b2.cx, ay=b2.top;
          var hs=10; // arrowhead size
          ctx.beginPath();
          ctx.moveTo(ax,ay);
          ctx.lineTo(ax-hs,ay-hs*1.4);
          ctx.lineTo(ax+hs,ay-hs*1.4);
          ctx.closePath();
          ctx.fillStyle=iNode.color;ctx.globalAlpha=0.65;ctx.fill();ctx.globalAlpha=1;
        });
      }
    });
  }

  function themePills(themes){
    if(!themes)return '';if(!Array.isArray(themes))themes=themes.split('|');if(!themes.length)return '';
    var THEME_COLORS={
      'Economic inclusion':'#185FA5','Children and caregivers':'#D4537E',
      'Municipal finance for migrants and refugees':'#0F6E56','Health':'#993C1D',
      'Gender equality':'#6B3FA0','Housing':'#854F0B','Climate migration':'#1D9E75',
      'Reception':'#378ADD','Pathways':'#639922','Sport':'#C9963A'
    };
    var h='<div class="fieldlabel">MMC Frontier Themes</div><div class="row">';
    themes.forEach(function(t){
      var c=THEME_COLORS[t]||'#666';
      h+='<span class="chip" style="background:'+c+'18;border-color:'+c+';color:'+c+'">'+t+'</span>';
    });
    return h+'</div>';
  }

  function bldInf(node,level){
    var tagcls={s:'source',en:'enabler',int:'intermediary',d:'destination'}[level];
    var tagtxt={s:'Source',en:'Enabler',int:'Intermediary',d:'Destination'}[level];
    var h='<span class="lvltag tag '+tagcls+'">'+tagtxt+'</span>';
    h+='<strong>'+node.l+'</strong>';
    if(node.desc)h+='<span style="color:#666">'+node.desc+'</span>';
    if(node.note&&typeof node.note==='string')h+='<br><span class="note">&#9888; '+node.note+'</span>';
    if(node.themes)h+=themePills(node.themes);
    if(node.i2i&&node.i2i.length){
      var targets=node.i2i.map(function(tid){var t=I.find(function(x){return x.id===tid;});return t?t.l:tid;}).join(', ');
      h+='<div class="fieldlabel">Channels funds through &#8674;</div><div class="row"><span class="chip">'+targets+'</span></div>';
    }
    if(node.intLinks&&node.intLinks.length){
      var targets=node.intLinks.map(function(tid){var t=I.find(function(x){return x.id===tid;});return t?t.l:tid;}).join(', ');
      h+='<div class="fieldlabel">Also supports (system-level TA) &#8674;</div><div class="row"><span class="chip">'+targets+'</span></div>';
    }
    var upstreamI=I.filter(function(other){return other.i2i&&other.i2i.indexOf(node.id)>=0;});
    if(upstreamI.length){
      var sources=upstreamI.map(function(x){return x.l;}).join(', ');
      h+='<div class="fieldlabel">&#8672; Receives pass-through funds from</div><div class="row"><span class="chip">'+sources+'</span></div>';
    }
    var aum=node.aum||[];
    if(aum.length){h+='<div class="fieldlabel">Estimated capital available</div><div class="row">';aum.forEach(function(a){h+='<span class="chip">'+a.t+': <b>'+a.v+'</b> ('+a.y+')</span>';});h+='</div>';}
    var subs=node.sub||node.sub_;
    if(subs&&subs.length){
      h+='<div class="fieldlabel">Named entities &mdash; click for details</div><div class="row" id="srl">';
      subs.forEach(function(s,idx){h+='<span class="subchip" data-idx="'+idx+'">'+s.name+'</span>';});
      h+='</div><div id="sdt"></div>';
    } else if(node.placeholder){
      h+='<div class="ph">Named entities to be populated.</div>';
    }
    return h;
  }

  function sel(id,tp,node){
    if(act===id){rst();return;}
    act=id;atype=tp;curNode=node;
    var c=gc(id,tp);
    S.forEach(function(s){var el=document.getElementById('n-'+s.id);if(!el)return;el.classList.toggle('dim',c.s.indexOf(s.id)<0);});
    EN.forEach(function(e){var el=document.getElementById('n-'+e.id);if(!el)return;el.classList.toggle('dim',c.en.indexOf(e.id)<0);});
    I.forEach(function(i){var el=document.getElementById('n-'+i.id);if(!el)return;el.classList.toggle('dim',c.int.indexOf(i.id)<0);});
    D.forEach(function(d){var el=document.getElementById('n-'+d.id);if(!el)return;el.classList.toggle('dim',c.d.indexOf(d.id)<0);});
    document.getElementById('inf').innerHTML=bldInf(node,tp);
    var srl=document.getElementById('srl');
    if(srl){srl.querySelectorAll('.subchip').forEach(function(chip){chip.onclick=function(){shwSub(parseInt(chip.getAttribute('data-idx')));};});}
    setTimeout(function(){redraw(c);},60);
  }

  function shwSub(idx){
    var subs=curNode.sub||curNode.sub_;if(!subs)return;
    var s=subs[idx];if(!s)return;
    document.querySelectorAll('.subchip').forEach(function(el){el.classList.remove('sel');});
    var chip=document.querySelector('[data-idx="'+idx+'"]');if(chip)chip.classList.add('sel');

    // Trigger flow trace on parent category so graphic responds
    if(act&&atype){
      var c=gc(act,atype);
      setTimeout(function(){redraw(c);},30);
      // Dim all nodes except those in the active flow
      S.forEach(function(s2){var el=document.getElementById('n-'+s2.id);if(!el)return;
      // Highlight if in active source set OR in srcLinks
      var active=c.s.indexOf(s2.id)>=0||(c.srcLinks&&c.srcLinks.indexOf(s2.id)>=0);
      el.classList.toggle('dim',!active);
    });
      EN.forEach(function(e){var el=document.getElementById('n-'+e.id);if(!el)return;el.classList.toggle('dim',c.en.indexOf(e.id)<0);});
      I.forEach(function(i){var el=document.getElementById('n-'+i.id);if(!el)return;el.classList.toggle('dim',c.int.indexOf(i.id)<0);});
      D.forEach(function(d){var el=document.getElementById('n-'+d.id);if(!el)return;el.classList.toggle('dim',c.d.indexOf(d.id)<0);});
    }

    var h='<div class="subdetail"><strong style="display:block;margin-bottom:3px">'+s.name;
    if(s.url)h+=' <a class="linklike" href="'+s.url+'" target="_blank" rel="noopener" style="font-size:10.5px">'+s.url.replace('https://','').replace('http://','')+'</a>';
    h+='</strong>'+s.desc;
    if(s.note&&typeof s.note==='string')h+='<br><span class="note">&#9888; '+s.note+'</span>';
    if(s.themes)h+=themePills(s.themes);
    if(s.aum&&s.aum.length){h+='<div class="fieldlabel">Estimated capital available</div><div class="row">';s.aum.forEach(function(a){h+='<span class="chip">'+a.t+': <b>'+a.v+'</b> ('+a.y+')</span>';});h+='</div>';}
    if(s.donors){h+='<div class="fieldlabel">Donors / investors involved</div><div class="row"><span class="chip">'+s.donors+'</span></div>';}
    if(s.engagement){h+='<div class="fieldlabel">Recommended MMC engagement</div><div style="margin-top:3px;font-size:11px">'+s.engagement+'</div>';}
    if(s.source){h+='<div class="fieldlabel">Data source</div><div class="row"><a class="linklike" href="'+s.source.url+'" target="_blank" rel="noopener" style="font-size:10.5px">'+s.source.label+'</a></div>';}
    h+='<div style="font-size:10px;color:#aaa;margin-top:8px;font-style:italic">Flows shown are for the parent category. Sub-actor level flow mapping coming in a future update.</div>';
    h+='</div>';
    document.getElementById('sdt').innerHTML=h;
  }

  function rst(){
    act=null;atype=null;curNode=null;
    document.querySelectorAll('.nc').forEach(function(el){el.classList.remove('dim');});
    document.getElementById('inf').textContent='Click any category or named actor, or search above, to trace its place in the capital flow.';
    document.getElementById('srch').value='';
    document.getElementById('srd').innerHTML='';document.getElementById('srd').classList.remove('show');
    var cv=document.getElementById('cv');
    if(cv){cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}
  }

  // Build search index including frontier themes
  var IDX=[];
  S.forEach(function(s){
    IDX.push({id:s.id,tp:'s',label:s.l,node:s,match:s.l.toLowerCase(),lvl:'Source'});
    (s.sub||[]).forEach(function(x,idx){
      var t=Array.isArray(x.themes)?x.themes:(x.themes||'').split('|');var matchStr=x.name.toLowerCase()+' '+t.join(' ').toLowerCase();
      IDX.push({id:s.id,tp:'s',label:x.name+' \u2014 '+s.l,node:s,match:matchStr,subIdx:idx,lvl:'Source actor'});
    });
  });
  EN.forEach(function(e){
    IDX.push({id:e.id,tp:'en',label:e.l,node:e,match:e.l.toLowerCase(),lvl:'Enabler'});
    (e.sub_||[]).forEach(function(x,idx){
      IDX.push({id:e.id,tp:'en',label:x.name+' \u2014 '+e.l,node:e,match:x.name.toLowerCase(),subIdx:idx,lvl:'Enabler actor'});
    });
  });
  I.forEach(function(i){
    IDX.push({id:i.id,tp:'int',label:i.l,node:i,match:i.l.toLowerCase(),lvl:'Intermediary'});
    (i.sub||[]).forEach(function(x,idx){
      var t=Array.isArray(x.themes)?x.themes:(x.themes||'').split('|');var matchStr=x.name.toLowerCase()+' '+t.join(' ').toLowerCase();
      IDX.push({id:i.id,tp:'int',label:x.name+' \u2014 '+i.l,node:i,match:matchStr,subIdx:idx,lvl:'Intermediary actor'});
    });
  });
  D.forEach(function(d){IDX.push({id:d.id,tp:'d',label:d.l,node:d,match:d.l.toLowerCase(),lvl:'Destination'});});

  var srchEl=document.getElementById('srch');
  var srdEl=document.getElementById('srd');
  srchEl.oninput=function(){
    var q=this.value.trim().toLowerCase();
    srdEl.innerHTML='';
    if(!q){srdEl.classList.remove('show');return;}
    var hits=IDX.filter(function(x){return x.match.indexOf(q)>=0;}).slice(0,18);
    if(!hits.length){srdEl.classList.remove('show');return;}
    hits.forEach(function(h){
      var el=document.createElement('div');
      el.className='sri';
      el.innerHTML='<span>'+h.label+'</span><span class="lvl">'+h.lvl+'</span>';
      el.onclick=function(){
        srdEl.classList.remove('show');srchEl.value=h.label;
        sel(h.id,h.tp,h.node);
        if(h.subIdx!==undefined){setTimeout(function(){shwSub(h.subIdx);},150);}
      };
      srdEl.appendChild(el);
    });
    srdEl.classList.add('show');
  };
  srchEl.onkeydown=function(e){if(e.key==='Escape'){srdEl.classList.remove('show');srchEl.value='';}};
  document.addEventListener('click',function(e){if(!srchEl.contains(e.target)&&!srdEl.contains(e.target)){srdEl.classList.remove('show');}});
  document.getElementById('rbtn').onclick=rst;
  window.addEventListener('resize',function(){if(act&&atype){var c=gc(act,atype);setTimeout(function(){redraw(c);},60);}});
  rndr();
}
init();
</script>
</body>
</html>
